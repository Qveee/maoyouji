<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5d89c"/>
      <stop offset="0.5" stop-color="#9cc980"/>
      <stop offset="1" stop-color="#8abc6d"/>
    </linearGradient>
    <radialGradient id="tree" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#6fae5f"/>
      <stop offset="1" stop-color="#3e7a41"/>
    </radialGradient>
    <radialGradient id="bush" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#8cc474"/>
      <stop offset="1" stop-color="#5f9a56"/>
    </radialGradient>
  </defs>

  <!-- 草地底色 -->
  <rect width="512" height="512" fill="url(#grass)"/>

  <!-- 草地斑驳 -->
  <g opacity="0.10">
    <circle cx="60" cy="90" r="70" fill="#6faf58"/>
    <circle cx="430" cy="70" r="80" fill="#7ab863"/>
    <circle cx="250" cy="200" r="90" fill="#cfe6ae"/>
    <circle cx="90" cy="330" r="75" fill="#83bd66"/>
    <circle cx="400" cy="400" r="85" fill="#6faf58"/>
    <circle cx="300" cy="470" r="60" fill="#d3e8b3"/>
  </g>

  <!-- 土路（对角蜿蜒） -->
  <path d="M-20 400 C 120 380, 150 300, 260 300 S 420 220, 540 180" fill="none"
        stroke="#d9c496" stroke-width="46" stroke-linecap="round" opacity="0.9"/>
  <path d="M-20 400 C 120 380, 150 300, 260 300 S 420 220, 540 180" fill="none"
        stroke="#c9b183" stroke-width="34" stroke-linecap="round" opacity="0.55"/>

  <!-- 右上小水塘 -->
  <ellipse cx="440" cy="440" rx="70" ry="46" fill="#8ec2d4" stroke="#6aa7bc" stroke-width="5"/>
  <ellipse cx="425" cy="432" rx="26" ry="13" fill="#a9d4e2" opacity="0.8"/>

  <!-- 树冠（俯视） -->
  <g>
    <ellipse cx="86" cy="60" rx="30" ry="26" fill="#000" opacity="0.14"/><circle cx="80" cy="54" r="30" fill="url(#tree)"/><circle cx="92" cy="46" r="14" fill="#8cc974" opacity="0.5"/>
    <ellipse cx="220" cy="46" rx="34" ry="30" fill="#000" opacity="0.14"/><circle cx="214" cy="40" r="34" fill="url(#tree)"/><circle cx="226" cy="32" r="15" fill="#8cc974" opacity="0.5"/>
    <ellipse cx="380" cy="90" rx="28" ry="24" fill="#000" opacity="0.14"/><circle cx="375" cy="85" r="28" fill="url(#tree)"/><circle cx="386" cy="78" r="12" fill="#8cc974" opacity="0.5"/>
    <ellipse cx="500" cy="330" rx="32" ry="28" fill="#000" opacity="0.14"/><circle cx="494" cy="324" r="32" fill="url(#tree)"/><circle cx="506" cy="316" r="14" fill="#8cc974" opacity="0.5"/>
    <ellipse cx="70" cy="210" rx="26" ry="22" fill="#000" opacity="0.14"/><circle cx="65" cy="205" r="26" fill="url(#tree)"/><circle cx="75" cy="199" r="11" fill="#8cc974" opacity="0.5"/>
    <ellipse cx="180" cy="140" rx="24" ry="20" fill="#000" opacity="0.14"/><circle cx="176" cy="136" r="24" fill="url(#tree)"/>
    <ellipse cx="320" cy="120" rx="22" ry="19" fill="#000" opacity="0.14"/><circle cx="316" cy="116" r="22" fill="url(#tree)"/>
    <ellipse cx="150" cy="480" rx="28" ry="24" fill="#000" opacity="0.14"/><circle cx="145" cy="474" r="28" fill="url(#tree)"/>
    <ellipse cx="290" cy="420" rx="24" ry="20" fill="#000" opacity="0.14"/><circle cx="286" cy="416" r="24" fill="url(#tree)"/>
  </g>

  <!-- 灌木 -->
  <g>
    <circle cx="130" cy="250" r="14" fill="url(#bush)"/>
    <circle cx="145" cy="258" r="11" fill="url(#bush)"/>
    <circle cx="350" cy="230" r="15" fill="url(#bush)"/>
    <circle cx="365" cy="238" r="11" fill="url(#bush)"/>
    <circle cx="60" cy="430" r="13" fill="url(#bush)"/>
    <circle cx="230" cy="350" r="12" fill="url(#bush)"/>
    <circle cx="470" cy="200" r="13" fill="url(#bush)"/>
  </g>

  <!-- 小花与草丛 -->
  <g>
    <circle cx="100" cy="150" r="3.5" fill="#fff"/><circle cx="112" cy="146" r="2.5" fill="#ffd66b"/>
    <circle cx="250" cy="90" r="3" fill="#fff"/><circle cx="262" cy="96" r="2.5" fill="#ffd66b"/>
    <circle cx="200" cy="300" r="3" fill="#fff"/><circle cx="330" cy="330" r="3.5" fill="#ffd66b"/>
    <circle cx="420" cy="140" r="3" fill="#fff"/><circle cx="40" cy="260" r="3" fill="#ffd66b"/>
    <circle cx="180" cy="380" r="3" fill="#fff"/><circle cx="360" cy="480" r="3" fill="#ffd66b"/>
    <path d="M90 190 q3 -9 6 0 M96 192 q3 -8 6 0" stroke="#5d9450" stroke-width="2" fill="none"/>
    <path d="M240 240 q3 -9 6 0 M246 242 q3 -8 6 0" stroke="#5d9450" stroke-width="2" fill="none"/>
    <path d="M390 300 q3 -9 6 0 M396 302 q3 -8 6 0" stroke="#5d9450" stroke-width="2" fill="none"/>
    <path d="M140 420 q3 -9 6 0 M146 422 q3 -8 6 0" stroke="#5d9450" stroke-width="2" fill="none"/>
  </g>
</svg>
