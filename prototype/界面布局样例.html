<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喵游记 · 界面布局样例 v1.3.1</title>
<style>
  :root{
    --bg:#e9edf3; --panel:#ffffff; --panel2:#f2f5fa; --line:#d8dfeb;
    --txt:#333a4d; --dim:#7c86a0; --amber:#b0721a; --red:#d64545;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 "Microsoft YaHei",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  /* ===== 顶部状态条 ===== */
  header{display:flex;align-items:center;gap:18px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
  header .game-name{font-size:17px;font-weight:700;color:var(--amber)}
  header .char{display:flex;align-items:center;gap:8px}
  header .avatar{width:34px;height:34px;border-radius:8px;background:#eef1f6;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px}
  .bar{width:110px;height:10px;background:#e8ecf2;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
  .bar>i{display:block;height:100%}
  .bar.hp>i{background:linear-gradient(90deg,#e05252,#ff8a70)}
  .bar.mp>i{background:linear-gradient(90deg,#4f8de0,#7ab3f5)}
  .mini-stat{color:var(--dim);font-size:12px}
  .mini-stat b{color:var(--txt)}
  header .money{margin-left:auto;font-size:13px}
  header .money span{color:#c78a1e}
  /* ===== 三栏六区：地图列加宽、中列收窄 ===== */
  main{flex:1;display:grid;grid-template-columns:minmax(430px,1.3fr) minmax(270px,.9fr) minmax(310px,1.05fr);grid-template-rows:47% 53%;gap:8px;padding:8px;min-height:0}
  .zone{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .zone-title{flex:none;display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--amber);border-bottom:1px solid var(--line);background:var(--panel2)}
  .zone-body{flex:1;min-height:0;overflow:auto}
  .z-map{grid-area:1/1}.z-monster{grid-area:1/2}.z-world{grid-area:1/3}
  .z-log{grid-area:2/1}.z-player{grid-area:2/2}.z-channel{grid-area:2/3}
  /* ===== 地图区域（背景图 + 数字方块格） ===== */
  .map-wrap{padding:10px;display:flex;flex-direction:column;gap:8px;height:100%;min-height:0}
  .map-view{position:relative;flex:1;min-height:0;border-radius:10px;overflow:hidden;border:1px solid #c4cf9e}
  .map-bg{position:absolute;inset:0;background:url("地图背景.svg") center/cover no-repeat}
  .map-shade{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.06),rgba(30,50,30,.10));pointer-events:none}
  #mapGrid{position:absolute;inset:8px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:5px}
  .cell{position:relative;background:rgba(255,255,255,.66);border:2px solid rgba(70,84,110,.38);border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.1s;backdrop-filter:blur(1px)}
  .cell:hover{border-color:#e08a00;background:rgba(255,255,255,.88)}
  .cell .num{font:700 15px/1 Consolas,monospace;color:#42506e;letter-spacing:1px}
  .cell .mm{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:11px;line-height:1;filter:drop-shadow(0 1px 1px rgba(255,255,255,.9))}
  .cell .badge{position:absolute;top:-7px;right:-6px;background:#d64545;color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 6px;border:1px solid #fff}
  .cell.me{border-color:#2f9e44;background:rgba(180,235,175,.75);box-shadow:0 0 0 2px rgba(47,158,68,.35)}
  .cell.town{border-color:#c78a1e;background:rgba(255,225,160,.78)}
  .cell.boss{border-color:#d64545;background:rgba(255,190,185,.72)}
  .cell.cur{outline:3px solid #ffb01f;outline-offset:-1px}
  .map-legend{font-size:11.5px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
  .map-legend b{color:#42506e}
  /* ===== 实体列表 ===== */
  .entity-list{list-style:none;padding:6px}
  .entity-list li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;border:1px solid transparent}
  .entity-list li:hover{background:var(--panel2);border-color:var(--line)}
  .entity-list li.dead{opacity:.45}
  .e-face{width:32px;height:32px;border-radius:7px;background:#eef1f6;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
  .e-main{flex:1;min-width:0}
  .e-name{cursor:pointer;font-weight:600}
  .e-name:hover{color:var(--amber);text-decoration:underline}
  .e-name.t-精英{color:#c78a1e} .e-name.t-BOSS{color:var(--red)}
  .e-sub{font-size:11px;color:var(--dim)}
  .hpbar{height:6px;width:100%;max-width:160px;background:#e8ecf2;border-radius:3px;margin-top:3px;overflow:hidden;border:1px solid var(--line)}
  .hpbar>i{display:block;height:100%;background:linear-gradient(90deg,#e05252,#ff8a70)}
  .btns{display:flex;gap:5px;flex:none}
  .ibtn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#eef1f6;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s;padding:0}
  .ibtn:hover{transform:translateY(-1px);filter:brightness(.96);border-color:#b9c4d6}
  .ibtn.atk{background:#fdecec;border-color:#efb3b3}
  .empty-tip{padding:22px 12px;text-align:center;color:var(--dim);font-size:12.5px}
  /* ===== 日志/聊天 ===== */
  .logbox{padding:8px 10px;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
  .logbox p{line-height:1.7;word-break:break-all}
  .l-sys{color:var(--dim)} .l-hit{color:#c0454a} .l-crit{color:#d92a30;font-weight:700}
  .l-get{color:#1f8a4c} .l-move{color:#3d6fb4} .l-drop{color:#b0721a}
  .chat-line{line-height:1.8}
  .chat-line .who{font-weight:700}
  .chat-line .who.me{color:#1f8a4c} .chat-line .who.o1{color:#c05e91} .chat-line .who.o2{color:#3d6fb4} .chat-line .who.o3{color:#b06a2e}
  .chat-line.ann{background:#fdf3e0;border-left:3px solid #d99a2b;padding:2px 6px;margin:2px 0;color:#8a5a10;border-radius:0 4px 4px 0}
  .tabs{display:flex;gap:4px;margin-left:auto}
  .tab{padding:2px 10px;border-radius:6px;font-size:12px;color:var(--dim);cursor:pointer;border:1px solid transparent;font-weight:400}
  .tab.on{color:var(--amber);background:#f7ecd8;border-color:#e3cfa4}
  .chat-input{flex:none;display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
  .chat-input input{flex:1;background:#fff;border:1px solid var(--line);border-radius:7px;color:var(--txt);padding:6px 10px;outline:none;font-size:13px}
  .chat-input input:focus{border-color:#d99a2b}
  .chat-input button{background:#f7ecd8;color:var(--amber);border:1px solid #e3cfa4;border-radius:7px;padding:0 16px;cursor:pointer}
  /* ===== 弹窗 / Toast ===== */
  #mask{position:fixed;inset:0;background:rgba(40,50,70,.35);display:none;align-items:center;justify-content:center;z-index:50}
  #mask.show{display:flex}
  .modal{width:400px;max-width:92vw;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 12px 40px rgba(30,40,60,.18)}
  .m-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--panel2);border-bottom:1px solid var(--line)}
  .m-head .face{width:44px;height:44px;font-size:26px;border-radius:9px;background:#eef1f6;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  .m-head h3{font-size:16px}
  .m-head .x{margin-left:auto;cursor:pointer;color:var(--dim);font-size:18px;padding:2px 8px}
  .m-head .x:hover{color:var(--red)}
  .m-body{padding:12px 14px;max-height:52vh;overflow:auto}
  .kv{display:grid;grid-template-columns:88px 1fr;gap:4px 10px;font-size:13px;margin-bottom:10px}
  .kv b{color:var(--dim);font-weight:400}
  .drops span{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin:2px 4px 2px 0;font-size:12px}
  .m-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  .btn{border-radius:8px;border:1px solid var(--line);background:#eef1f6;color:var(--txt);padding:6px 16px;cursor:pointer}
  .btn.primary{background:#fdecec;border-color:#efb3b3;color:#c0454a;font-weight:700}
  .btn.primary:hover,.btn:hover{filter:brightness(.96)}
  #toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .toast-item{background:rgba(255,255,255,.96);border:1px solid #d99a2b;color:#8a5a10;padding:7px 18px;border-radius:20px;font-size:13px;box-shadow:0 4px 14px rgba(30,40,60,.12);animation:tin .2s}
  @keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
</style>
</head>
<body>

<header>
  <span class="game-name">🐱 喵游记</span>
  <div class="char"><span class="avatar">🐱</span><div>
    <div>狸花大侠 <span style="color:var(--dim);font-size:12px">Lv.18 狸花猫 · 少年猫</span></div>
    <div style="display:flex;gap:6px;align-items:center">
      <div class="bar hp"><i style="width:78%"></i></div><span class="mini-stat">312/400</span>
      <div class="bar mp"><i style="width:55%"></i></div><span class="mini-stat">121/220</span>
    </div>
  </div></div>
  <span class="mini-stat">🍖 饱食 <b>72</b>　😊 心情 <b>85</b>　💤 疲劳 <b>23</b></span>
  <span class="money">🪙 <span>12,640</span>　💎 86</span>
</header>

<main>
  <!-- ① 左上：地图区域（背景图 + 数字方块格） -->
  <section class="zone z-map">
    <div class="zone-title">🗺️ 地图区域 · <span style="color:var(--txt)">月牙森林</span>（Lv.10~20）<span id="posTip" style="margin-left:auto;color:var(--dim);font-weight:400;font-size:12px">当前位于 07</span></div>
    <div class="map-wrap">
      <div class="map-view">
        <div class="map-bg"></div><div class="map-shade"></div>
        <div id="mapGrid"></div>
      </div>
      <div class="map-legend"><span>格子编号 <b>00-35</b></span><span><b>每次只能走一格</b>（点击相邻格子）</span><span>角标数字 = 怪物数量</span><span>🏘️ 00 草原小镇</span><span>👑 35 BOSS</span></div>
    </div>
  </section>

  <!-- ② 中上：怪物列表（当前格子的多只怪物） -->
  <section class="zone z-monster">
    <div class="zone-title">👾 当前格子怪物<span id="cellTip" style="margin-left:auto;color:var(--dim);font-weight:400;font-size:12px"></span></div>
    <ul class="entity-list zone-body" id="monsterList"></ul>
  </section>

  <!-- ③ 右上：世界聊天/公告 -->
  <section class="zone z-world">
    <div class="zone-title">🌍 世界频道
      <div class="tabs"><span class="tab on" data-wt="chat">世界聊天</span><span class="tab" data-wt="ann">📢 世界公告</span></div>
    </div>
    <div class="zone-body logbox" id="worldBox"></div>
  </section>

  <!-- ④ 左下：战斗/走动记录 -->
  <section class="zone z-log">
    <div class="zone-title">📜 战斗 / 走动记录<span style="margin-left:auto;color:var(--dim);font-size:12px;font-weight:400;cursor:pointer" onclick="clearLog()">🧹 清屏</span></div>
    <div class="zone-body logbox" id="logBox"></div>
  </section>

  <!-- ⑤ 中下：玩家列表 -->
  <section class="zone z-player">
    <div class="zone-title">🐱 同地图玩家（4）<span style="margin-left:auto;color:var(--dim);font-weight:400;font-size:12px">点击姓名查看信息</span></div>
    <ul class="entity-list zone-body" id="playerList"></ul>
  </section>

  <!-- ⑥ 右下：频道聊天 -->
  <section class="zone z-channel">
    <div class="zone-title">💬 频道
      <div class="tabs" id="chTabs">
        <span class="tab" data-ch="私人">私人</span><span class="tab" data-ch="队伍">队伍</span>
        <span class="tab" data-ch="公会">公会</span><span class="tab on" data-ch="区域">区域</span>
      </div>
    </div>
    <div class="zone-body logbox" id="chBox"></div>
    <div class="chat-input"><input id="chatInput" placeholder="输入聊天内容，回车发送…"><button onclick="sendChat()">发送</button></div>
  </section>
</main>

<div id="mask" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
/* ============ 图标（内联 SVG） ============ */
const ICON = {
  atk:  c=>`<button class="ibtn atk" title="攻击" onclick="event.stopPropagation();${c}"><svg viewBox="0 0 24 24" width="15" height="15"><path fill="#d64545" d="M19 2.5 21.5 5 12 14.5l-1.8-1.8L20 3zM10.5 13.9l-1.4-1.4-3.4 3.4-1-1L3 16.6l2.1 2.1L3 20.8 3.2 21l2.1-2.1L7.4 21l1.7-1.7-1-1zM14 16l4 4-1.5 1.5-2.2-2.2L12 21l-3-3z"/></svg></button>`,
  paw:  c=>`<button class="ibtn" title="跟随" onclick="event.stopPropagation();${c}"><svg viewBox="0 0 24 24" width="15" height="15" fill="#d98324"><ellipse cx="12" cy="15.5" rx="4.4" ry="3.6"/><circle cx="6" cy="11" r="2"/><circle cx="10" cy="8" r="2.1"/><circle cx="14" cy="8" r="2.1"/><circle cx="18" cy="11" r="2"/></svg></button>`,
  team: c=>`<button class="ibtn" title="组队" onclick="event.stopPropagation();${c}"><svg viewBox="0 0 24 24" width="15" height="15" fill="#3b82f6"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 18.5c0-3.3 2.9-5.3 6.5-5.3s6.5 2 6.5 5.3v1h-13z"/><circle cx="16.8" cy="9" r="2.5"/><path d="M14.5 18.5c0-2.3 1.2-3.9 3-4.6 2.4.6 4 2.2 4 4.6v1h-7z"/></svg></button>`,
  trade:c=>`<button class="ibtn" title="交易" onclick="event.stopPropagation();${c}"><svg viewBox="0 0 24 24" width="15" height="15" fill="#f5a524"><circle cx="8.5" cy="8.5" r="5.2"/><circle cx="15.8" cy="15.8" r="5.2"/><circle cx="8.5" cy="8.5" r="2.2" fill="#fff"/><circle cx="15.8" cy="15.8" r="2.2" fill="#fff"/></svg></button>`,
  chat: c=>`<button class="ibtn" title="聊天" onclick="event.stopPropagation();${c}"><svg viewBox="0 0 24 24" width="15" height="15" fill="#22a55c"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9l-5.5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg></button>`
};

/* ============ 数据 ============ */
const monsters = {
  1:{id:1,name:'灰狼',emoji:'🐺',lv:14,type:'普通',element:'风 · 被火克制',hp:180,maxHp:180,atk:52,def:26,spd:19,rec:12,skills:['撕咬 物理130%','嚎叫 攻击UP'],drops:[['狼皮',35],['兽肉',50],['C级爪子',8]]},
  2:{id:2,name:'松鼠',emoji:'🐿️',lv:12,type:'普通',element:'地 · 被风克制',hp:120,maxHp:120,atk:38,def:18,spd:22,rec:10,skills:['坚果投掷 物理110%'],drops:[['松果',60],['毛皮',25]]},
  3:{id:3,name:'猫头鹰',emoji:'🦉',lv:15,type:'普通',element:'风 · 被火克制',hp:165,maxHp:165,atk:58,def:22,spd:20,rec:11,skills:['俯冲 物理140%','夜枭凝视 30%眩晕'],drops:[['羽毛',40],['风之羽',6]]},
  4:{id:4,name:'毒蘑菇',emoji:'🍄',lv:13,type:'精英',element:'地 · 被风克制',hp:340,maxHp:340,atk:60,def:40,spd:10,rec:26,skills:['毒雾 中毒3回合','孢子扩散 群体80%'],drops:[['毒囊',80],['毒系技能书',15]]},
  5:{id:5,name:'月影狼王',emoji:'👑',lv:20,type:'BOSS',element:'暗 · 被光克制',hp:1900,maxHp:1900,atk:120,def:60,spd:28,rec:104,skills:['月牙斩 物理180%','召唤狼群','狂暴（阶段2）'],drops:[['A级武器·银月弯爪',100],['进化石',30],['BOSS称号',100]]}
};
/* 每个格子的怪物分布（一格格子多种怪物） */
const cellMonsters = {
  8:[1,2], 9:[2], 13:[2,3], 14:[1], 15:[1,2,3],
  20:[3,4], 21:[4], 26:[2], 27:[1,3], 33:[1,2], 34:[1], 35:[5]
};
const TOWN=0, BOSS_CELL=35;
let pos=7; /* 玩家起始格子 07 */

const players = [
  {name:'橘座驾到',emoji:'🐱',breed:'橘猫',lv:18,title:'干饭王',gear:'银月弯爪 +7 · 蛛丝软甲 +5',guild:'猫饭同好会',cell:12},
  {name:'夜里翻墙',emoji:'🐱',breed:'黑猫',lv:16,title:'夜行者',gear:'暗影之爪 +6 · 夜行软甲 +4',guild:'月光旅团',cell:35},
  {name:'布偶不是偶',emoji:'🐱',breed:'布偶猫',lv:15,title:'首席奶妈',gear:'圣光法杖 +5 · 布偶长袍 +6',guild:'猫饭同好会',cell:16},
  {name:'三花聚顶',emoji:'🐱',breed:'三花猫',lv:17,title:'欧皇',gear:'幸运戒指 +7 · 三花护符 +3',guild:'流浪猫联盟',cell:22}
];
const worldChats=[
  ['夜里翻墙','狼王在 35 格，有人一起吗，求组！','o2'],
  ['橘座驾到','刚在餐厅吃了大餐，饱食度拉满，开干','o1'],
  ['三花聚顶','出货了！！狼王掉了银月弯爪，幸运值就是真理','o3'],
  ['布偶不是偶','收毒囊，有的喵私聊我，价格好说','o2']
];
const anns=[
  ['系统公告','🎉 新玩法「虚空魔窟」现已开放，Lv.50 以上的猫侠可以挑战梦魇之影！'],
  ['系统公告','⚙️ 今晚 02:00-04:00 服务器维护，请提前下线保存。'],
  ['GM·大白','有任何问题请在世界频道 @GM，在线时间 9:00-22:00。']
];

  '私人':[['布偶不是偶','你好呀，毒囊还有吗？','o2'],['你','有 5 个，你出多少？','me'],['布偶不是偶','800 金一个全收！','o2']],
  '队伍':['你当前没有队伍，点击玩家列表的「组队」按钮邀请好友。'],
  '公会':[['会长·大橘','今晚 8 点公会战集合，都在群里吼一声'],['布偶不是偶','收到，我奶妈到位']]
};
chData['区域']=[['夜里翻墙','狼王刷新在 35 格了，快来'],['橘座驾到','等我吃完这口'],['夜里翻墙','……你到底是来吃饭还是来打架的']];

/* ============ 工具 ============ */
const $=s=>document.querySelector(s);
const pad2=n=>String(n).padStart(2,'0');
const xy=i=>({x:i%6,y:Math.floor(i/6)});
function toast(msg){const d=document.createElement('div');d.className='toast-item';d.textContent=msg;$('#toast').appendChild(d);setTimeout(()=>d.remove(),2600);}
function log(html,cls){const b=$('#logBox');const p=document.createElement('p');p.className=cls||'l-sys';p.innerHTML=html;b.appendChild(p);while(b.children.length>200)b.firstChild.remove();b.scrollTop=b.scrollHeight;}
function clearLog(){$('#logBox').innerHTML='';log('记录已清屏。');}
function chatLine(who,text,cls,ann){return '<p class="chat-line '+(ann?'ann':'')+'"><span class="who '+(cls||'')+'">'+who+'</span>：'+text+'</p>';}

/* ============ 地图（数字方块格 + 背景图 + 单格移动） ============ */
function cellAlive(i){return (cellMonsters[i]||[]).filter(id=>monsters[id].hp>0);}
function renderMap(){
  const g=$('#mapGrid');g.innerHTML='';
  for(let i=0;i<36;i++){
    const c=document.createElement('div');c.className='cell';
    if(i===TOWN)c.classList.add('town');
    if(i===BOSS_CELL)c.classList.add('boss');
    if(i===pos)c.classList.add('me','cur');
    const alive=cellAlive(i);
    let inner='<span class="num">'+pad2(i)+'</span>';
    if(i===TOWN)inner+='<span class="mm">🏘️</span>';
    else if(alive.length){inner+='<span class="mm">'+alive.map(id=>monsters[id].emoji).join('')+'</span>'+'<span class="badge">'+alive.length+'</span>';}
    c.innerHTML=inner;
    c.onclick=()=>clickCell(i);
    g.appendChild(c);
  }
  $('#posTip').textContent='当前位于 '+pad2(pos);
}
function clickCell(i){
  if(i===pos)return;
  const a=xy(pos),b=xy(i);
  if(Math.abs(a.x-b.x)+Math.abs(a.y-b.y)!==1){toast('每次只能走一格，请点击相邻格子');return;}
  pos=i;renderMap();
  log('你从 <b>'+pad2(a.y*6+a.x)+'</b> 移动到了 <b>'+pad2(i)+'</b>。','l-move');
  if(i===TOWN){toast('进入 🏘️ 草原小镇（安全区）');log('你进入了 🏘️ 草原小镇。','l-move');}
  renderMonsters();
}

/* ============ 怪物列表（当前格子） ============ */
function renderMonsters(){
  const alive=cellAlive(pos);
  $('#cellTip').textContent='格子 '+pad2(pos)+(alive.length?(' · '+alive.length+' 只怪物'):'');
  const ul=$('#monsterList');
  if(!alive.length){ul.innerHTML='<div class="empty-tip">当前格子没有怪物<br>走到带 👾 角标的格子试试</div>';return;}
  ul.innerHTML=alive.map(id=>{const m=monsters[id];return '<li class="'+(m.hp<=0?'dead':'')+'">' +
    '<span class="e-face">'+m.emoji+'</span>' +
    '<div class="e-main">' +
    '<span class="e-name t-'+m.type+'" onclick="openMonster(monsters['+id+'])">'+m.name+' <span style="color:var(--dim);font-weight:400;font-size:11px">Lv.'+m.lv+' · '+m.type+'</span></span>' +
    '<div class="hpbar"><i style="width:'+Math.max(0,m.hp)/m.maxHp*100+'%"></i></div>' +
    '<div class="e-sub">HP '+Math.max(0,m.hp)+'/'+m.maxHp+' · '+m.element+'</div></div>' +
    (m.hp>0?ICON.atk('attackMonster('+id+')'):'')+'</li>';}).join('');
}
function openMonster(m){
  $('#modal').innerHTML=
    '<div class="m-head"><span class="face">'+m.emoji+'</span><div><h3 class="t-'+m.type+'">'+m.name+' <span style="font-size:12px;color:var(--dim);font-weight:400">Lv.'+m.lv+' · '+m.type+' · '+m.element+'</span></h3>' +
    '<span style="font-size:12px;color:'+(m.lv>18?'#d92a30':'#1f8a4c')+'">推荐等级 '+m.lv+(m.lv>18?'（危险，建议组队）':'')+'</span></div><span class="x" onclick="closeModal()">✕</span></div>' +
    '<div class="m-body">' +
    '<div class="kv"><b>所在格子</b><span>'+pad2(pos)+'</span><b>HP</b><span>'+m.maxHp+'</span><b>物攻 / 魔攻</b><span>'+m.atk+' / '+Math.round(m.atk*0.7)+'</span><b>物防 / 魔防</b><span>'+m.def+' / '+Math.round(m.def*0.9)+'</span><b>速度</b><span>'+m.spd+'</span><b>经验 / 金币</b><span>'+(m.rec*4)+' / '+(m.rec*2)+'</span></div>' +
    '<b style="font-size:13px">⚔️ 技能</b><div class="drops">'+m.skills.map(s=>'<span>'+s+'</span>').join('')+'</div>' +
    '<b style="font-size:13px">🎁 掉落（基础概率）</b><div class="drops">'+m.drops.map(d=>'<span>'+d[0]+' '+d[1]+'%</span>').join('')+'</div>' +
    '</div>' +
    '<div class="m-foot"><button class="btn" onclick="closeModal()">关闭</button>'+(m.hp>0?'<button class="btn primary" onclick="attackMonster('+m.id+');closeModal()">⚔ 发起攻击</button>':'')+'</div>';
  $('#mask').classList.add('show');
}
function openPlayer(p){
  $('#modal').innerHTML=
    '<div class="m-head"><span class="face">'+p.emoji+'</span><div><h3>'+p.name+' <span style="font-size:12px;color:var(--dim);font-weight:400">Lv.'+p.lv+' '+p.breed+'</span></h3><span style="font-size:12px;color:var(--amber)">称号：'+p.title+' · 公会：'+p.guild+' · 所在格子 '+pad2(p.cell)+'</span></div><span class="x" onclick="closeModal()">✕</span></div>' +
    '<div class="m-body"><div class="kv"><b>装备</b><span>'+p.gear+'</span><b>状态</b><span style="color:#1f8a4c">在线 · 同地图</span></div></div>' +
    '<div class="m-foot"><button class="btn" onclick="closeModal()">关闭</button></div>';
  $('#mask').classList.add('show');
}
function closeModal(){$('#mask').classList.remove('show');}

/* ============ 战斗模拟 ============ */
function attackMonster(id){
  const m=monsters[id];if(!m||m.hp<=0)return;
  toast('⚔ 对 '+m.name+' 发起攻击！');log('—— 你对 <b>'+m.name+'</b>（格子 '+pad2(pos)+'）发起了攻击 ——');
  let t=0;
  const rounds=()=>{t++;const crit=Math.random()<0.2;let dmg=Math.round((85+Math.random()*40)*(crit?1.6:1)*(m.type==='BOSS'?0.55:1));
    m.hp-=dmg;log(crit?('💥 <b>暴击！</b>你对 '+m.name+' 造成 <b>'+dmg+'</b> 点伤害'):('你对 '+m.name+' 造成 '+dmg+' 点伤害'),crit?'l-crit':'l-hit');
    if(m.hp<=0){
      m.hp=0;const exp=m.rec*4,gold=m.rec*2;
      log('🏆 你击败了 <b>'+m.name+'</b>！获得经验 +'+exp+'、金币 +'+gold,'l-get');
      const drop=m.drops.filter(d=>Math.random()*100<d[1]);
      if(drop.length)log('🎁 掉落：'+drop.map(d=>d[0]).join('、'),'l-drop');
      m.deadT=5;
      const cd=setInterval(()=>{m.deadT--;renderMonsters();renderMap();
        if(m.deadT<=0){clearInterval(cd);m.hp=m.maxHp;log('♻️ '+m.name+' 在格子 '+pad2(pos)+' 刷新了');renderMonsters();renderMap();}},1000);
    } else if(t<3){
      setTimeout(()=>{const back=Math.round(m.atk*(0.6+Math.random()*0.5)*0.8);
        log(m.name+' 对你造成 '+back+' 点伤害','l-hit');setTimeout(rounds,450);},450);
    }
    renderMonsters();renderMap();};
  setTimeout(rounds,200);
}

/* ============ 玩家列表 ============ */
function renderPlayers(){
  $('#playerList').innerHTML=players.map((p,i)=>
    '<li><span class="e-face">'+p.emoji+'</span>' +
    '<div class="e-main">' +
    '<span class="e-name" onclick="openPlayer(players['+i+'])">'+p.name+' <span style="color:var(--dim);font-weight:400;font-size:11px">Lv.'+p.lv+' '+p.breed+' · '+p.title+'</span></span>' +
    '<div class="e-sub">公会：'+p.guild+' · 所在格子 '+pad2(p.cell)+'</div></div>' +
    '<div class="btns">'+ICON.chat("act('聊天','"+p.name+"')")+ICON.paw("act('跟随','"+p.name+"')")+ICON.team("act('组队','"+p.name+"')")+ICON.trade("act('交易','"+p.name+"')")+ICON.atk("act('切磋','"+p.name+"')")+'</div></li>').join('');
}
function act(type,name){
  if(type==='聊天'){switchCh('私人');toast('已打开与 '+name+' 的私聊');$('#chatInput').focus();}
  else if(type==='跟随'){toast('🐾 开始跟随 '+name+'（再次点击取消）');log('你开始跟随 <b>'+name+'</b>。','l-move');}
  else if(type==='组队'){toast('已向 '+name+' 发送组队邀请');log('你向 <b>'+name+'</b> 发送了组队邀请，等待确认…');}
  else if(type==='交易'){toast('已向 '+name+' 发送交易请求（需在城市内）');log('你向 <b>'+name+'</b> 发起了交易请求。');}
  else if(type==='切磋'){toast('⚔ 已向 '+name+' 发起切磋（PVP）');log('你向 <b>'+name+'</b> 发起了切磋请求，等待对方接受…');}
}

/* ============ 聊天区 ============ */
let worldTab='chat',chTab='区域';
function renderWorld(){
  $('#worldBox').innerHTML=worldTab==='chat'
    ?worldChats.map(c=>chatLine(c[0],c[1],c[2])).join('')
    :anns.map(a=>chatLine('📢 '+a[0],a[1],'',true)).join('');
  $('#worldBox').scrollTop=9e9;
}
function renderCh(){
  $('#chBox').innerHTML=chData[chTab].map(c=>Array.isArray(c)?chatLine(c[0],c[1],c[2]):'<p class="l-sys">'+c+'</p>').join('');
  $('#chBox').scrollTop=9e9;
}
function switchCh(t){chTab=t;document.querySelectorAll('#chTabs .tab').forEach(e=>e.classList.toggle('on',e.dataset.ch===t));renderCh();}
function sendChat(){const v=$('#chatInput').value.trim();if(!v)return;chData[chTab].push(['你',v,'me']);$('#chatInput').value='';renderCh();}

/* ============ 事件绑定 ============ */
document.querySelectorAll('[data-wt]').forEach(t=>t.onclick=function(){worldTab=t.dataset.wt;document.querySelectorAll('[data-wt]').forEach(e=>e.classList.toggle('on',e===t));renderWorld();});
document.querySelectorAll('#chTabs .tab').forEach(t=>t.onclick=function(){switchCh(t.dataset.ch);});
$('#chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat();});

/* 走动记录 & 世界聊天滚动模拟 */
const moves=['橘座驾到 离开了月牙森林，前往 幽暗洞穴','夜里翻墙 从格子 35 移动到了 34','布偶不是偶 进入了月牙森林','三花聚顶 在格子 22 发现了宝箱','夜里翻墙 离开了月牙森林，前往 猫之城'];
let mi=0;setInterval(()=>{log(moves[mi++%moves.length],'l-move');},6000);
let wi=0;const wc=[['布偶不是偶','狼王几点刷？'],['三花聚顶','刚摸了个金色宝箱，美滋滋'],['夜里翻墙','收风之羽，高价收'],['橘座驾到','强化又失败，第3次了，下把必成！'],['会长·大橘','公会战报名开始啦，大家踊跃参加']];
setInterval(()=>{worldChats.push(wc[wi%wc.length]);wi++;if(worldTab==='chat')renderWorld();},9000);

/* ============ 初始化 ============ */
renderMap();renderMonsters();renderPlayers();renderWorld();renderCh();
log('欢迎来到 <b>月牙森林</b>（Lv.10~20），你目前在 <b>07</b> 格。');
log('提示：点击相邻格子移动（每次一格）；带 👾 角标的格子有怪物，走到后在中上列表点击攻击。');
</script>
