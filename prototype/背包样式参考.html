<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>道具背包 · 风格参考（6 款）</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#2e3440;font:14px/1.6 "Microsoft YaHei",SimSun,sans-serif;color:#d8dee9;padding:26px 20px 60px}
  h1{font:bold 22px SimHei;color:#ffd34d;text-align:center;margin-bottom:6px}
  .tip{text-align:center;color:#9aa5b6;font-size:13px;margin-bottom:26px}
  .tip b{color:#ffd34d}
  .grid{display:flex;flex-wrap:wrap;gap:30px;justify-content:center;max-width:1240px;margin:0 auto}
  .cell{width:355px}
  .cap{text-align:center;margin-bottom:8px;font:bold 15px SimHei}
  .cap small{display:block;font:12px SimSun;opacity:.75;font-weight:normal;margin-top:2px}
  .cell.picked .cap::after{content:' ✓ 已选择';color:#5adf6a}

  /* ============ 窗口基础结构（各风格共用的骨架） ============ */
  .win{width:355px;height:430px;display:flex;flex-direction:column;border:1px solid #4a4a4a;background:#fff;box-shadow:3px 4px 10px rgba(0,0,0,.4);cursor:pointer}
  .cell.picked .win{outline:3px solid #5adf6a;outline-offset:2px}
  .bag-title{height:26px;flex:none;display:flex;align-items:center;gap:4px;padding:0 3px 0 8px;border-bottom:1px solid rgba(0,0,0,.25)}
  .bag-title b{font:bold 13px SimHei;letter-spacing:.5px}
  .win-btns{margin-left:auto;display:flex;gap:2px}
  .win-btn{width:19px;height:19px;border:1px solid;border-radius:0;cursor:pointer;padding:0;display:grid;place-items:center}
  .win-btn svg{width:11px;height:11px;display:block}
  .bag-sub{height:24px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid rgba(0,0,0,.18)}
  .bag-sub a{font:12px SimSun;text-decoration:underline;cursor:pointer}
  .bag-money{margin-left:auto;display:flex;gap:10px;align-items:center;font:bold 12px Verdana}
  .bag-money .coin{display:flex;align-items:center;gap:3px}
  .bag-money svg{width:13px;height:13px}
  .bag-list{flex:1;overflow-y:auto}
  .bag-row{display:flex;align-items:center;gap:8px;height:40px;padding:0 8px;border-bottom:1px}
  .bag-row .ic{width:32px;height:32px;flex:none;display:grid;place-items:center;border:1px solid;background:#fff}
  .bag-row .ic svg{width:28px;height:28px;display:block}
  .bag-row .nm{font:12px SimSun;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bag-row .nm:hover{text-decoration:underline}
  .bag-row .qt{margin-left:auto;font:12px SimSun;white-space:nowrap;flex:none}

  /* ============ 风格A：经典蓝渐变（当前版） ============ */
  .skin-a .win{border-color:#4a4a4a}
  .skin-a .bag-title{background:linear-gradient(#cde9f5,#aed7ea);border-color:#7fb0cc}
  .skin-a .bag-title b{color:#14506e}
  .skin-a .win-btn{border-color:#8aa8b8;background:linear-gradient(#fff,#dcecf5)}
  .skin-a .win-btn:hover{background:#ffe9ae}
  .skin-a .bag-sub{background:#fafbfc;border-color:#d8d8d8}
  .skin-a .bag-sub a{color:#b06a2e}
  .skin-a .bag-money{color:#7a4a10}
  .skin-a .bag-row:nth-child(even){background:#f5f7f8}
  .skin-a .bag-row{border-color:#eef1f3}
  .skin-a .bag-row .ic{border-color:#e0e4e8}
  .skin-a .bag-row .nm{color:#2b2fb5}
  .skin-a .bag-row .qt{color:#c43a12}
  .skin-a .bag-list{scrollbar-color:#d4d4d4 #efefef}
  .skin-a .bag-list::-webkit-scrollbar{width:14px}
  .skin-a .bag-list::-webkit-scrollbar-track{background:#efefef;border-left:1px solid #d8d8d8}
  .skin-a .bag-list::-webkit-scrollbar-thumb{background:#d4d4d4;border:1px solid #a8a8a8}
  .skin-a .cap{color:#8fd0f5}

  /* ============ 风格B：暗金贵族 ============ */
  .skin-b .win{background:#2b241c;border-color:#8a6a2a;box-shadow:0 0 0 1px #4a3a18,3px 4px 12px rgba(0,0,0,.6)}
  .skin-b .bag-title{background:linear-gradient(#6a542e,#3d2f18);border-color:#8a6a2a}
  .skin-b .bag-title b{color:#ffd88a;text-shadow:0 1px 1px #000}
  .skin-b .win-btn{border-color:#8a6a2a;background:linear-gradient(#4a3a20,#2e2412)}
  .skin-b .win-btn svg [stroke]{stroke:#ffd88a}
  .skin-b .win-btn svg [fill]{fill:#ffd88a}
  .skin-b .bag-sub{background:#332a1e;border-color:#4a3a24}
  .skin-b .bag-sub a{color:#e8b45a}
  .skin-b .bag-money{color:#ffd88a}
  .skin-b .bag-row{border-color:#3d3324}
  .skin-b .bag-row:nth-child(even){background:#3a3022}
  .skin-b .bag-row:nth-child(odd){background:#332a1e}
  .skin-b .bag-row .ic{border-color:#5a4828;background:#262014}
  .skin-b .bag-row .nm{color:#ffd88a}
  .skin-b .bag-row .qt{color:#ff9a52}
  .skin-b .bag-list{scrollbar-color:#6a542e #26201a}
  .skin-b .bag-list::-webkit-scrollbar{width:14px}
  .skin-b .bag-list::-webkit-scrollbar-track{background:#26201a;border-left:1px solid #4a3a24}
  .skin-b .bag-list::-webkit-scrollbar-thumb{background:#6a542e;border:1px solid #8a6a2a}
  .skin-b .cap{color:#ffd88a}

  /* ============ 风格C：羊皮卷武侠 ============ */
  .skin-c .win{background:#f4e8cc;border-color:#8a5a2a;box-shadow:inset 0 0 0 3px #f4e8cc,inset 0 0 0 4px #c9a468,3px 4px 10px rgba(60,30,0,.35)}
  .skin-c .bag-title{background:linear-gradient(#d9ae6a,#b88a44);border-color:#8a5a2a}
  .skin-c .bag-title b{color:#4a2e08;text-shadow:0 1px 0 rgba(255,255,255,.4)}
  .skin-c .win-btn{border-color:#8a5a2a;background:linear-gradient(#f4e0b8,#dcb87a)}
  .skin-c .bag-sub{background:#eee0bc;border-color:#c9a468}
  .skin-c .bag-sub a{color:#8a4a10}
  .skin-c .bag-money{color:#6a4410}
  .skin-c .bag-row{border-color:#e0d0a8}
  .skin-c .bag-row:nth-child(even){background:#ece0c0}
  .skin-c .bag-row:nth-child(odd){background:#f4e8cc}
  .skin-c .bag-row .ic{border-color:#c9a468;background:#faf2dc}
  .skin-c .bag-row .nm{color:#8a4a10}
  .skin-c .bag-row .qt{color:#b83a10}
  .skin-c .bag-list{scrollbar-color:#b88a44 #eee0bc}
  .skin-c .bag-list::-webkit-scrollbar{width:14px}
  .skin-c .bag-list::-webkit-scrollbar-track{background:#eee0bc;border-left:1px solid #c9a468}
  .skin-c .bag-list::-webkit-scrollbar-thumb{background:#b88a44;border:1px solid #8a5a2a}
  .skin-c .cap{color:#e8c87a}

  /* ============ 风格D：暗黑魔幻 ============ */
  .skin-d .win{background:#161a24;border-color:#3a7a8a;box-shadow:0 0 0 1px #0a0c12,0 0 14px rgba(58,122,138,.35),3px 4px 12px rgba(0,0,0,.6)}
  .skin-d .bag-title{background:linear-gradient(#2a3242,#161a24);border-color:#3a7a8a}
  .skin-d .bag-title b{color:#7fd8e8;text-shadow:0 0 6px rgba(127,216,232,.5)}
  .skin-d .win-btn{border-color:#3a7a8a;background:linear-gradient(#1e2634,#12161f)}
  .skin-d .win-btn svg [stroke]{stroke:#7fd8e8}
  .skin-d .win-btn svg [fill]{fill:#7fd8e8}
  .skin-d .bag-sub{background:#1a1f2c;border-color:#243040}
  .skin-d .bag-sub a{color:#5ab8d8}
  .skin-d .bag-money{color:#a8e8f5}
  .skin-d .bag-row{border-color:#222a3a}
  .skin-d .bag-row:nth-child(even){background:#1e2432}
  .skin-d .bag-row:nth-child(odd){background:#181d29}
  .skin-d .bag-row .ic{border-color:#2c3a4e;background:#10141d}
  .skin-d .bag-row .nm{color:#7ab8e8}
  .skin-d .bag-row .qt{color:#e86a5a}
  .skin-d .bag-list{scrollbar-color:#3a5a74 #12161f}
  .skin-d .bag-list::-webkit-scrollbar{width:14px}
  .skin-d .bag-list::-webkit-scrollbar-track{background:#12161f;border-left:1px solid #243040}
  .skin-d .bag-list::-webkit-scrollbar-thumb{background:#3a5a74;border:1px solid #5a8aa8}
  .skin-d .cap{color:#7fd8e8}

  /* ============ 风格E：木质暖调 ============ */
  .skin-e .win{background:#fff8e8;border-color:#8a5a2a;box-shadow:inset 0 0 0 2px #d9a45a,inset 0 0 0 3px #8a5a2a,3px 4px 10px rgba(60,30,0,.3)}
  .skin-e .bag-title{background:repeating-linear-gradient(90deg,#c98f4a 0,#c98f4a 26px,#bf8540 26px,#bf8540 52px);border-color:#8a5a2a}
  .skin-e .bag-title b{color:#5a3a0a;text-shadow:0 1px 0 rgba(255,255,255,.35)}
  .skin-e .win-btn{border-color:#8a5a2a;background:linear-gradient(#ffe9c4,#e8b878)}
  .skin-e .bag-sub{background:#fdf3d8;border-color:#d9a45a}
  .skin-e .bag-sub a{color:#a05a10}
  .skin-e .bag-money{color:#7a4a10}
  .skin-e .bag-row{border-color:#eedcba}
  .skin-e .bag-row:nth-child(even){background:#f8ecd4}
  .skin-e .bag-row:nth-child(odd){background:#fff8e8}
  .skin-e .bag-row .ic{border-color:#d9a45a;background:#fffcf0}
  .skin-e .bag-row .nm{color:#2a6aa8}
  .skin-e .bag-row .qt{color:#c85a10}
  .skin-e .bag-list{scrollbar-color:#c98f4a #fdf3d8}
  .skin-e .bag-list::-webkit-scrollbar{width:14px}
  .skin-e .bag-list::-webkit-scrollbar-track{background:#fdf3d8;border-left:1px solid #d9a45a}
  .skin-e .bag-list::-webkit-scrollbar-thumb{background:#c98f4a;border:1px solid #8a5a2a}
  .skin-e .cap{color:#f0c078}

  /* ============ 风格F：Win95 复古灰 ============ */
  .skin-f .win{background:#c0c0c0;border-color:#c0c0c0;box-shadow:inset -1px -1px 0 #404040,inset 1px 1px 0 #fff,inset -2px -2px 0 #808080,inset 2px 2px 0 #dfdfdf,3px 4px 10px rgba(0,0,0,.4)}
  .skin-f .bag-title{background:#000080;border-color:#808080}
  .skin-f .bag-title b{color:#fff;font-weight:bold}
  .skin-f .win-btn{border-color:#fff #404040 #404040 #fff;background:#c0c0c0}
  .skin-f .win-btn svg [stroke]{stroke:#000}
  .skin-f .win-btn svg [fill]{fill:#000}
  .skin-f .bag-sub{background:#c0c0c0;border-color:#808080}
  .skin-f .bag-sub a{color:#0000c0}
  .skin-f .bag-money{color:#000080}
  .skin-f .bag-row{border-color:#d8d8d8}
  .skin-f .bag-row:nth-child(even){background:#e8e8e8}
  .skin-f .bag-row:nth-child(odd){background:#fff}
  .skin-f .bag-row .ic{border-color:#808080;background:#fff;box-shadow:inset 1px 1px 0 #404040}
  .skin-f .bag-row .nm{color:#0000c0}
  .skin-f .bag-row .qt{color:#800000}
  .skin-f .bag-list{scrollbar-color:#c0c0c0 #dfdfdf}
  .skin-f .bag-list::-webkit-scrollbar{width:16px}
  .skin-f .bag-list::-webkit-scrollbar-track{background:#dfdfdf;box-shadow:inset 1px 0 0 #c0c0c0}
  .skin-f .bag-list::-webkit-scrollbar-thumb{background:#c0c0c0;box-shadow:inset -1px -1px 0 #404040,inset 1px 1px 0 #fff,inset -2px -2px 0 #808080,inset 2px 2px 0 #dfdfdf}
  .skin-f .cap{color:#d8d8d8}

  #picked-tip{position:fixed;left:0;right:0;bottom:0;background:#1b202a;border-top:1px solid #3a4456;padding:10px;text-align:center;color:#9aa5b6;font-size:13px;display:none}
  #picked-tip.show{display:block}
  #picked-tip b{color:#5adf6a}
</style>
</head>
<body>

<h1>🎒 道具背包 · 6 款风格参考</h1>
<p class="tip">同样的内容与交互，不同皮肤 —— <b>点击窗口选择你喜欢的风格</b>，告诉我编号即可应用到游戏</p>

<div class="grid" id="grid"></div>
<div id="picked-tip">已选择：<b id="picked-name">—</b>（回复"用风格X"即可应用）</div>

<script>
const CRISP = 'shape-rendering="crispEdges"';
const ITEMS = [
  ['传送石',1,'块','点击使用,可传送到已记录的传送点。',`<svg viewBox="0 0 32 32" ${CRISP}><rect x="8" y="6" width="16" height="4" fill="#b8c2cc"/><rect x="5" y="10" width="22" height="4" fill="#9aa5b0"/><rect x="4" y="14" width="24" height="12" fill="#8a95a0"/><rect x="7" y="26" width="18" height="4" fill="#75808c"/><rect x="10" y="10" width="6" height="3" fill="#d8e0e6"/><rect x="15" y="12" width="2" height="10" fill="#3aa0e8"/><rect x="11" y="16" width="10" height="2" fill="#3aa0e8"/><rect x="15" y="16" width="2" height="2" fill="#8fd8ff"/><rect x="19" y="13" width="2" height="2" fill="#8fd8ff"/><rect x="11" y="21" width="2" height="2" fill="#8fd8ff"/></svg>`],
  ['金刚锉',642,'个','打造装备的材料,可提升强化成功率。',`<svg viewBox="0 0 32 32" ${CRISP}><rect x="20" y="4" width="7" height="4" fill="#c8ccd4"/><rect x="16" y="8" width="9" height="4" fill="#aeb6c0"/><rect x="12" y="12" width="9" height="4" fill="#aeb6c0"/><rect x="8" y="16" width="9" height="4" fill="#98a2ac"/><rect x="18" y="8" width="1" height="4" fill="#5a626e"/><rect x="14" y="12" width="1" height="4" fill="#5a626e"/><rect x="10" y="16" width="1" height="4" fill="#5a626e"/><rect x="22" y="5" width="1" height="2" fill="#5a626e"/><rect x="4" y="20" width="7" height="8" fill="#8a5a2a"/><rect x="3" y="24" width="4" height="6" fill="#6e4620"/></svg>`],
  ['练功房门卡',1264,'张','进入练功房修炼的通行凭证。',`<svg viewBox="0 0 32 32" ${CRISP}><rect x="6" y="7" width="20" height="18" fill="#e8f0f6" stroke="#8aa0b4"/><rect x="6" y="7" width="20" height="4" fill="#3a6a9a"/><rect x="9" y="14" width="9" height="2" fill="#9ab4c8"/><rect x="9" y="18" width="13" height="2" fill="#9ab4c8"/><rect x="21" y="13" width="3" height="3" fill="#3a6a9a"/><rect x="12" y="5" width="8" height="2" fill="#6a8aa4"/></svg>`],
  ['竹蜻蜓',491,'支','双手一搓就能飞上天空的古老玩具。',`<svg viewBox="0 0 32 32" ${CRISP}><rect x="3" y="7" width="12" height="3" fill="#7ab848"/><rect x="17" y="7" width="12" height="3" fill="#5a9a34"/><rect x="6" y="10" width="9" height="2" fill="#8fcf5a"/><rect x="17" y="10" width="9" height="2" fill="#6aae3e"/><rect x="14" y="6" width="4" height="5" fill="#6e4a1e"/><rect x="15" y="11" width="2" height="17" fill="#c9a24a"/><rect x="13" y="26" width="6" height="2" fill="#a8843a"/></svg>`],
  ['元素碎片',1946,'块','蕴含元素之力的晶体碎片,合成材料。',`<svg viewBox="0 0 32 32" ${CRISP}><rect x="11" y="5" width="2" height="4" fill="#59d8d0"/><rect x="10" y="9" width="4" height="12" fill="#59d8d0"/><rect x="14" y="12" width="5" height="10" fill="#3ab8b0"/><rect x="7" y="13" width="3" height="9" fill="#7fe8e0"/><rect x="7" y="22" width="13" height="3" fill="#2a8880"/><rect x="21" y="7" width="2" height="2" fill="#ffffff"/><rect x="24" y="10" width="2" height="2" fill="#cdfaf6"/></svg>`],
  ['虚空碎片',901,'块','来自虚空魔窟的暗紫色结晶。',`<svg viewBox="0 0 32 32" ${CRISP}><rect x="13" y="4" width="2" height="3" fill="#c9a0f0"/><rect x="12" y="7" width="4" height="10" fill="#a86ae0"/><rect x="16" y="10" width="5" height="12" fill="#7a3ab8"/><rect x="9" y="12" width="3" height="9" fill="#c9a0f0"/><rect x="8" y="21" width="14" height="3" fill="#4a2470"/><rect x="14" y="8" width="2" height="2" fill="#e8d0ff"/><rect x="23" y="6" width="2" height="2" fill="#c9a0f0"/></svg>`],
  ['中级守护灵饲料',126,'个','守护灵最爱吃的口粮,可提升经验。',`<svg viewBox="0 0 32 32" ${CRISP}><rect x="12" y="7" width="8" height="4" fill="#c9a45a"/><rect x="11" y="10" width="10" height="2" fill="#8a6a30"/><rect x="9" y="12" width="14" height="14" fill="#d9b46a"/><rect x="20" y="12" width="3" height="14" fill="#c9a45a"/><rect x="11" y="26" width="10" height="2" fill="#b8934a"/><rect x="12" y="16" width="8" height="7" fill="#f4e6c8"/><rect x="14" y="18" width="4" height="2" fill="#b06a2e"/><rect x="23" y="24" width="2" height="2" fill="#e8c87a"/><rect x="26" y="26" width="2" height="2" fill="#e8c87a"/></svg>`],
  ['神符石',2314,'枚','刻有古老符文的石片,技能升级材料。',`<svg viewBox="0 0 32 32" ${CRISP}><rect x="8" y="5" width="16" height="21" fill="#98a2ae"/><rect x="8" y="5" width="3" height="21" fill="#b8c0ca"/><rect x="24" y="5" width="2" height="21" fill="#7a8490"/><rect x="13" y="9" width="6" height="2" fill="#f5a524"/><rect x="11" y="13" width="10" height="2" fill="#f5a524"/><rect x="13" y="17" width="6" height="2" fill="#f5a524"/><rect x="11" y="21" width="10" height="2" fill="#d9821a"/><rect x="10" y="26" width="12" height="3" fill="#6a7480"/></svg>`]
];
const SKINS = [
  ['A','经典蓝渐变','当前游戏采用:浅蓝渐变标题+白底隔行,朴素清爽'],
  ['B','暗金贵族','深棕底+金色描边文字,征途/大话式厚重感'],
  ['C','羊皮卷武侠','羊皮纸底色+描金边框,剑侠江湖怀旧味'],
  ['D','暗黑魔幻','深蓝黑底+青色霓虹描边,魔幻游戏冷冽感'],
  ['E','木质暖调','木纹标题+奶油底+双线木框,梦幻式温暖'],
  ['F','Win95复古灰','纯 Windows 95 灰+立体斜面边框,极致怀旧']
];
const winBtns = `
  <div class="win-btns">
    <button class="win-btn" title="刷新"><svg viewBox="0 0 12 12"><g fill="currentColor"><path d="M1 2.5h6v-2l4 3-4 3v-2H1z"/><path d="M11 9.5H5v2l-4-3 4-3v2h6z"/></g></svg></button>
    <button class="win-btn" title="最小化"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" fill="currentColor"/></svg></button>
    <button class="win-btn" title="关闭"><svg viewBox="0 0 12 12"><g stroke="currentColor" stroke-width="2" stroke-linecap="square" fill="none"><line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/></g></svg></button>
  </div>`;
const money = `
  <div class="bag-money">
    <span class="coin"><svg viewBox="0 0 13 13"><circle cx="6.5" cy="6.5" r="5.5" fill="#f5c93a" stroke="#a87a10"/><rect x="4.5" y="4.5" width="4" height="4" fill="#a87a10"/></svg>21089</span>
    <span class="coin"><svg viewBox="0 0 13 13"><circle cx="6.5" cy="6.5" r="5.5" fill="#c8ccd4" stroke="#8a8f99"/><rect x="4.5" y="4.5" width="4" height="4" fill="#8a8f99"/></svg>52</span>
    <span class="coin"><svg viewBox="0 0 13 13"><circle cx="6.5" cy="6.5" r="5.5" fill="#d98a50" stroke="#9a5a24"/><rect x="4.5" y="4.5" width="4" height="4" fill="#9a5a24"/></svg>38</span>
  </div>`;
/* 双份数据让列表滚动,展示各风格滚动条 */
const rows = ITEMS.concat(ITEMS.map(x=>[...x]));
const listHtml = rows.map(([name,qty,unit,desc,icon])=>`
  <div class="bag-row">
    <span class="ic" title="${desc}">${icon}</span>
    <a class="nm" title="${desc}">${name}</a>
    <span class="qt">${qty} ${unit}</span>
  </div>`).join('');
document.getElementById('grid').innerHTML = SKINS.map(([id,name,desc])=>`
  <div class="cell skin-${id.toLowerCase()}" data-id="${id}" data-name="风格${id} · ${name}">
    <div class="cap">风格${id} · ${name}<small>${desc}</small></div>
    <div class="win">
      <div class="bag-title"><b>携带道具: 16 / 300</b>${winBtns}</div>
      <div class="bag-sub"><a>【兑换猫眼】</a>${money}</div>
      <div class="bag-list">${listHtml}</div>
    </div>
  </div>`).join('');
document.getElementById('grid').addEventListener('click',e=>{
  const cell = e.target.closest('.cell'); if(!cell) return;
  document.querySelectorAll('.cell').forEach(c=>c.classList.remove('picked'));
  cell.classList.add('picked');
  document.getElementById('picked-name').textContent = cell.dataset.name;
  document.getElementById('picked-tip').classList.add('show');
});
</script>
</body>
</html>
